services:
  recoverai:
    build: .
    ports:
      - "8000:8000"
    environment: &application_environment
      RECOVERAI_PROFILE: "${RECOVERAI_PROFILE:-development}"
      RECOVERAI_JWT_SECRET: "${RECOVERAI_JWT_SECRET:-}"
      RECOVERAI_WEBHOOK_SECRET: "${RECOVERAI_WEBHOOK_SECRET:-}"
      RECOVERAI_API_KEYS: "${RECOVERAI_API_KEYS:-}"
      # Existing external databases only. Startup never provisions either database.
      RECOVERAI_DB_URL: "${RECOVERAI_DB_URL:-}"
      RECOVERAI_SOURCE: "${RECOVERAI_SOURCE:-}"
      RECOVERAI_SOURCE_URL: "${RECOVERAI_SOURCE_URL:-}"
      RECOVERAI_SOURCE_QUERY: "${RECOVERAI_SOURCE_QUERY:-}"
      RECOVERAI_SOURCE_COLUMNS: "${RECOVERAI_SOURCE_COLUMNS:-}"
      RECOVERAI_SOURCE_PROVIDER: "${RECOVERAI_SOURCE_PROVIDER:-razorpay}"
      RECOVERAI_SOURCE_TENANT: "${RECOVERAI_SOURCE_TENANT:-default}"
      RECOVERAI_SOURCE_LIMIT: "${RECOVERAI_SOURCE_LIMIT:-5000}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: .
    profiles: ["worker"]
    command: ["python", "-m", "scripts.worker"]
    environment: *application_environment
